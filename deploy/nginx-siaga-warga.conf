# Simpan sebagai /etc/nginx/sites-available/siaga-warga
# Lalu: sudo ln -s /etc/nginx/sites-available/siaga-warga /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d siaga.contoh.id
server {
    listen 80;
    listen [::]:80;
    server_name siaga.contoh.id;

    root /var/www/siaga-warga/public;
    index index.php;

    charset utf-8;
    client_max_body_size 6M;          # foto bukti maksimal 2 MB, sisakan ruang

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # berkas build Vite & ikon PWA: cache lama, isinya ber-hash
    location ~* ^/(build|ikon)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # service worker harus selalu segar, kalau tidak warga memakai versi lama
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SSE: harus lewat PHP-FPM (bukan proxy), matikan buffering agar pesan langsung terkirim
    location = /perubahan/aliran {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffering off;
        fastcgi_read_timeout 900s;
        gzip off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # sesuaikan versi PHP di VPS
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
